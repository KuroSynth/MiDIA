const S={page:'home',taskTab:'pendientes',financeTab:'movimientos',modal:null,toast:null,routines:[{id:1,title:'Revisar mi agenda',done:true},{id:2,title:'Preparar el día',done:false},{id:3,title:'Revisar pendientes importantes',done:false}],tasks:[{id:1,title:'Llamar para pedir cita médica',when:'Ayer',status:'carry',note:'Quedó pendiente ayer'},{id:2,title:'Revisar trámite personal',when:'Hace 3 días',status:'carry',note:'Quedó pendiente hace 3 días'},{id:3,title:'Comprar material para el consultorio',when:'Hoy',status:'today',note:'Programado para hoy'}],appointments:[{id:1,time:'09:00',name:'Paciente 001',detail:'Consulta presencial',kind:'consultorio',status:'confirmada'},{id:2,time:'10:30',name:'Paciente 002',detail:'Consulta en línea',kind:'consultorio',status:'confirmada'},{id:3,time:'12:00',name:'Tiempo para pendientes',detail:'Bloque personal',kind:'personal',status:'personal'},{id:4,time:'16:00',name:'Paciente 003',detail:'Consulta presencial',kind:'consultorio',status:'pendiente'},{id:5,time:'18:00',name:'Paciente 004',detail:'Consulta en línea',kind:'consultorio',status:'confirmada'}],confirmations:[{id:11,name:'Paciente 005',time:'09:00',status:'pendiente'},{id:12,name:'Paciente 006',time:'11:00',status:'confirmada'},{id:13,name:'Paciente 007',time:'17:00',status:'pendiente'}],honorarios:[{id:101,name:'Paciente 001',amount:850,status:'pagado',method:'Transferencia'},{id:102,name:'Paciente 002',amount:850,status:'pendiente',method:'—'},{id:103,name:'Paciente 003',amount:850,status:'pagado',method:'Tarjeta'},{id:104,name:'Paciente 004',amount:850,status:'pendiente',method:'—'}],expenses:[{id:1,name:'Supermercado',amount:1260,category:'Alimentación',method:'Tarjeta',reviewed:true,installments:1},{id:2,name:'Consulta médica',amount:899,category:'Salud',method:'Tarjeta',reviewed:true,installments:1},{id:3,name:'Compra en tienda',amount:340,category:'Sin clasificar',method:'Efectivo',reviewed:false,installments:1},{id:4,name:'Electrodoméstico',amount:1200,category:'Hogar',method:'Tarjeta',reviewed:true,installments:3},{id:5,name:'Movimiento por revisar',amount:570,category:'Sin clasificar',method:'Tarjeta',reviewed:false,installments:1},{id:6,name:'Transporte',amount:280,category:'Transporte',method:'Efectivo',reviewed:true,installments:1}],budget:7000,inbox:[{id:1,text:'https://ejemplo.com/articulo-interesante',kind:'Enlace',added:'Hoy'},{id:2,text:'Revisar documento pendiente',kind:'Nota',added:'Ayer'}],counter:50,weekDone:false};
const cats=['Sin clasificar','Alimentación','Salud','Hogar','Transporte','Servicios','Trabajo','Otros'];
const counts=()=>({carry:S.tasks.filter(x=>x.status==='carry').length,pend:S.confirmations.filter(x=>x.status==='pendiente').length,expenses:S.expenses.filter(x=>!x.reviewed).length,unpaid:S.honorarios.filter(x=>x.status==='pendiente').length});
function button(text,act,cl='btn',extra=''){return `<button type="button" class="${cl}" data-action="${act}" ${extra}>${text}</button>`;}
function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">${I('sun','lg')}</div><div><div class="brand-title">MI DÍA</div><span class="brand-sub">Un lugar para todo</span></div></div><div class="nav-list"><div class="nav-heading">MI ESPACIO</div>${pages.slice(0,3).map(([id,l,ic])=>nav(id,l,ic)).join('')}<div class="nav-heading">ADMINISTRACIÓN</div>${pages.slice(3).map(([id,l,ic])=>nav(id,l,ic)).join('')}</div><div class="sidebar-bottom">${I('shield','sm')} <strong>Prototipo privado</strong><p>Solo datos ficticios. No hay conexiones con Google, WhatsApp, bancos ni AppSheet.</p></div><div class="sidebar-demo">MI DÍA · Experiencia v1</div></aside>`;}
function nav(id,l,ic){return `<button class="nav-btn ${S.page===id?'selected':''}" data-page="${id}">${I(ic)}<span>${l}</span>${id==='tasks'&&counts().carry?`<span class="badgecount">${counts().carry}</span>`:''}</button>`;}
function mobileNav(){const ids=['home','tasks','consultorio','finanzas','inbox'];return `<nav class="mobile-nav" aria-label="Navegación principal">${ids.map(id=>{const a=pages.find(x=>x[0]===id);return `<button data-page="${id}" class="${S.page===id?'selected':''}" aria-label="${a[1]}">${I(a[2])}<span>${a[1]}</span></button>`}).join('')}</nav>`;}
function heading(eyebrow,title,subtitle,action=''){return `<header class="heading-row"><div><div class="overline">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</header>`;}
function metric(num,label,note='',cl=''){return `<div class="metric"><div class="number">${esc(num)}</div><div class="label">${label}</div><div class="note ${cl}">${note||'&nbsp;'}</div></div>`;}
function captureRibbon(){return `<div class="capture-card"><span class="capture-symbol">${I('plus','lg')}</span><button type="button" class="inputfake" data-action="capture"><strong>¿Algo por guardar?</strong> Texto, enlace o pendiente…</button>${button(`${I('plus')} <span class="desktop-text">Capturar</span>`,'capture','btn primary')}</div>`;}
function cardHead(title,right=''){return `<div class="card-head"><h2>${title}</h2>${right}</div>`;}
function apptRow(a){return `<div class="appointment"><span class="time">${a.time}</span><span class="apt-marker ${a.kind==='personal'?'personal':a.status==='pendiente'?'wait':''}"></span><div class="apt-content"><strong>${a.name}</strong><span>${a.detail}</span></div>${a.kind==='personal'?'<span class="tag purple">Personal</span>':a.status==='confirmada'?'<span class="tag green">Confirmada</span>':'<span class="tag amber">Por confirmar</span>'}</div>`;}
function routines(){return S.routines.map(r=>`<div class="routine"><label><input type="checkbox" data-routine="${r.id}" ${r.done?'checked':''}/><span>${esc(r.title)}</span></label></div>`).join('');}
function shortTask(t){return `<div class="task-row"><span class="warn-dot"></span><div class="task-info"><strong>${esc(t.title)}</strong><div class="meta">${esc(t.note||t.when)}</div></div><select data-taskchoice="${t.id}" aria-label="Decidir qué hacer con ${esc(t.title)}"><option value="">Elegir…</option><option value="today">Hacer hoy</option><option value="later">Otra fecha</option><option value="archive">Ya no aplica</option></select></div>`;}
function home(){const c=counts();return `${heading('TU ESPACIO · EJEMPLO','Un día más ligero','Todo lo importante, sin tener que abrir cinco aplicaciones.',button(`${I('plus')} <span class="desktop-text">Agregar algo</span>`,'capture','btn primary'))}<div class="metric-grid">${metric('5','Citas de hoy','Agenda de ejemplo')}${metric(c.pend,'Por confirmar','Citas de mañana','amber-text')}${metric(c.carry,'Pendientes anteriores','Sin mezclar con rutinas','amber-text')}${metric(c.expenses,'Gastos por revisar','Para tu cierre semanal')}</div>${captureRibbon()}<div class="two-col"><div class="col-stack"><section class="card card-pad">${cardHead('Tu agenda de hoy',`<button class="link" data-page="agenda">Ver agenda ${I('chevron','sm')}</button>`)}<div class="card-list">${S.appointments.map(apptRow).join('')}</div></section><section class="card card-pad">${cardHead(`Quedó pendiente <span class="tag amber">${c.carry}</span>`,`<button class="link" data-page="tasks">Ver todos ${I('chevron','sm')}</button>`)}${S.tasks.filter(t=>t.status==='carry').length?S.tasks.filter(t=>t.status==='carry').slice(0,3).map(shortTask).join(''):`<div class="empty"><h3>Todo al día</h3><p>No hay tareas anteriores por revisar.</p></div>`}<div class="soft" style="margin-top:12px"><span class="small">Aquí no se mezclan las tareas que quedaron abiertas con las actividades de rutina.</span></div></section></div><div class="col-stack"><section class="card card-pad">${cardHead('Mi rutina',`<span class="tag purple">${S.routines.filter(r=>r.done).length}/${S.routines.length} realizadas</span>`)}${routines()}</section><section class="card card-pad">${cardHead('Consultorio',`<button class="link" data-page="consultorio">Abrir ${I('chevron','sm')}</button>`)}<div class="soft green"><div class="box-title">${I('message','sm')} Confirmaciones de mañana</div><p class="small">${S.confirmations.filter(x=>x.status==='confirmada').length} confirmadas · ${c.pend} esperando respuesta</p></div><div class="divider"></div><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><strong style="font-size:13px">${c.unpaid} honorarios pendientes</strong><div class="small">Seguimiento al día siguiente</div></div>${I('chevron')}</div></section><section class="card card-pad">${cardHead('Finanzas',`<button class="link" data-page="finanzas">Revisar ${I('chevron','sm')}</button>`)}<div class="soft amber"><div class="box-title">${I('wallet','sm')} Revisión semanal</div><p class="small">Tienes ${c.expenses} movimientos de ejemplo por clasificar. Los totales no se presentan como saldos reales.</p></div></section></div></div>`;}
function agenda(){return `${heading('CALENDARIO','Agenda en un solo lugar','Un compromiso puede nacer de una tarea sin copiarlo entre apps.',button(`${I('plus')} <span class="desktop-text">Nueva cita</span>`,'new-event','btn primary'))}<div class="two-col"><section class="card card-pad">${cardHead('Citas y compromisos',`<span class="tag purple">Datos ficticios</span>`)}${S.appointments.map(apptRow).join('')}</section><div class="col-stack"><section class="card card-pad">${cardHead('De pendiente a cita')}<div class="soft green"><div class="box-title">${I('list','sm')} Llamar para pedir cita médica</div><p class="small">Puedes mantenerlo como pendiente y consultar horarios solo cuando estés lista para agendar.</p></div><div style="margin-top:14px">${button(`${I('calendar')} Consultar horario (demo)`,'show-availability','btn primary wide')}</div></section><section class="card card-pad"><h3>Integración prevista</h3><p class="small" style="margin-top:8px">En la versión real, aquí aparecerá la disponibilidad de Google Calendar. Este prototipo no crea ni modifica eventos.</p></section></div></div>`;}
function tasks(){const carry=S.tasks.filter(x=>x.status==='carry');const today=S.tasks.filter(x=>x.status==='today');const scheduled=S.tasks.filter(x=>x.status==='scheduled');const archived=S.tasks.filter(x=>x.status==='archived'||x.status==='done');return `${heading('ORGANIZACIÓN','Pendientes y rutinas','Las cosas que quedaron abiertas tienen su propio espacio.',button(`${I('plus')} <span class="desktop-text">Nuevo pendiente</span>`,'new-task','btn primary'))}<div class="chip-row" style="margin-bottom:18px">${[['pendientes','Pendientes anteriores'],['hoy','Para hoy'],['proximos','Próximos'],['rutinas','Mis rutinas'],['archivados','Historial']].map(([id,l])=>`<button data-tasktab="${id}" class="chip ${S.taskTab===id?'selected':''}">${l}</button>`).join('')}</div><div class="two-col"><section class="card card-pad">${S.taskTab==='pendientes'?`${cardHead('Cosas que quedaron pendientes',`<span class="tag amber">${carry.length}</span>`)}<p class="small" style="margin-bottom:15px">No se reprograman solas. Tú decides qué hacer con ellas.</p>${carry.length?carry.map(shortTask).join(''):`<div class="empty">${I('check','lg')}<h3>Todo recuperado</h3><p>Ya no hay pendientes anteriores.</p></div>`}`:S.taskTab==='hoy'?`${cardHead('Para resolver hoy',`<span class="tag green">${today.length}</span>`)}${today.length?today.map(t=>`<div class="task-row"><div class="task-info"><strong>${esc(t.title)}</strong><div class="meta">Programado para hoy</div></div>${button(`${I('check','sm')} Terminado`,'task-done-'+t.id,'btn sm')}</div>`).join(''):`<div class="empty">${I('check','lg')}<h3>Sin pendientes para hoy</h3></div>`}` : S.taskTab==='proximos'?`${cardHead('Pendientes reprogramados',`<span class="tag purple">${scheduled.length}</span>`)}${scheduled.length?scheduled.map(t=>`<div class="task-row"><div class="task-info"><strong>${esc(t.title)}</strong><div class="meta">Programado para ${esc(t.when)}</div></div>${button('Cambiar fecha','move-date-'+t.id,'btn sm')}</div>`).join(''):`<div class="empty">${I('calendar','lg')}<h3>No hay tareas reprogramadas</h3><p>Cuando elijas «Otra fecha», las encontrarás aquí.</p></div>`}` : S.taskTab==='archivados'?`${cardHead('Historial',`<span class="tag">${archived.length}</span>`)}${archived.length?archived.map(t=>`<div class="task-row"><div class="task-info"><strong>${esc(t.title)}</strong><div class="meta">${t.status==='done'?'Completado':'Ya no aplica'}</div></div>${button('Recuperar','restore-task-'+t.id,'btn sm')}</div>`).join(''):`<div class="empty">${I('archive','lg')}<h3>Sin elementos archivados</h3></div>`}` : `${cardHead('Mis rutinas de hoy',`<span class="tag purple">${S.routines.filter(x=>x.done).length}/${S.routines.length}</span>`)}${routines()}<p class="small" style="margin-top:16px">Las rutinas se marcan como realizadas. Los pendientes que no se resuelven no desaparecen.</p>`}</section><div class="col-stack"><section class="card card-pad">${cardHead('Guardar algo en segundos')}<p class="small" style="margin-bottom:13px">Sin tener que elegir una hora ni abrir Calendar.</p>${button(`${I('plus')} Capturar pendiente`,'capture','btn primary wide')}</section><section class="card card-pad"><div class="box-title">${I('spark','sm')} Cómo funciona</div><p class="small" style="margin-top:6px">Una rutina vuelve según su programación. Un pendiente no completado se mantiene separado hasta que decidas qué hacer.</p></section></div></div>`;}
function confirmRow(a){return `<div class="message"><div class="msg-avatar">${esc(a.name.split(' ')[1])}</div><div class="details"><strong>${esc(a.name)}</strong><p>Mañana · ${a.time}</p></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${a.status==='confirmada'?'<span class="tag green">Confirmada</span>':a.status==='reagendar'?'<span class="tag purple">Reagendar</span>':a.status==='cancelada'?'<span class="tag red">Cancelada</span>':'<span class="tag amber">Sin respuesta</span>'}${a.status==='pendiente'?button('Simular respuesta','simulate-reply-'+a.id,'btn sm'):a.status==='reagendar'?button('Abrir caso','manage-rebook-'+a.id,'btn sm'):''}</div></div>`;}
function honorRow(h){return `<div class="task-row"><div class="task-info"><strong>${h.name} · ${money(h.amount)}</strong><div class="meta">${h.method}${h.status==='pendiente'?' · pago pendiente':''}</div></div>${h.status==='pendiente'?button('Registrar pago','paid-'+h.id,'btn sm'):'<span class="tag green">Pagado</span>'}</div>`;}
function consultorio(){const c=counts();return `${heading('CONSULTORIO','Menos mensajes manuales','Tú intervienes cuando alguien necesita reagendar.',`<span class="tag purple">Simulación</span>`)}<div class="metric-grid">${metric(S.confirmations.length,'Citas de mañana','Para confirmar')}${metric(S.confirmations.filter(x=>x.status==='confirmada').length,'Confirmadas','Respuesta afirmativa')}${metric(c.pend,'Sin respuesta','Seguimiento previsto','amber-text')}${metric(c.unpaid,'Pagos pendientes','Recordatorio posterior','amber-text')}</div><div class="two-col"><div class="col-stack"><section class="card card-pad">${cardHead('Confirmaciones del día siguiente',`<span class="tag">09:00 · 13:00 · 16:00</span>`)}${S.confirmations.map(confirmRow).join('')}<div class="divider"></div><div class="notice">En producción, el envío automático, los mensajes de las 13:00 y la regla de las 16:00 requerirán validación del texto, del consentimiento y de la integración oficial de WhatsApp. <strong>Aquí no se envía ningún mensaje.</strong></div></section><section class="card card-pad">${cardHead('Registro de honorarios',`<span class="tag amber">${c.unpaid} pendientes</span>`)}${S.honorarios.map(honorRow).join('')}${button(`${I('check')} Cierre de consultas (demo)`,'close-day','btn wide',{disabled:false}.disabled?'disabled':'')}</section></div><div class="col-stack"><section class="card card-pad">${cardHead('Qué hace MI DÍA')}<div class="steps"><span class="step active">Antes de las 9:00</span><span class="step">13:00</span><span class="step">16:00</span></div><div class="divider"></div><div class="soft green"><strong style="font-size:13px">Respuesta «Sí» → confirmar</strong><p class="small" style="margin-top:4px">El estado cambia sin que tengas que revisar manualmente la conversación.</p></div><div class="soft purple" style="margin-top:10px"><strong style="font-size:13px">Solicitud de cambio → para ti</strong><p class="small" style="margin-top:4px">El sistema no decide nuevas fechas. Te presenta el caso.</p></div>${button(`${I('message')} Simular una respuesta`,'simulate-reply-'+(S.confirmations.find(x=>x.status==='pendiente')?.id||11),'btn wide',{disabled:false}.disabled?'disabled':'')}</section><div class="reminder-block"><strong style="font-size:13px">${I('clock','sm')} Recordatorios de pago</strong><p>Si un honorario sigue pendiente al día siguiente, MI DÍA podrá realizar seguimiento automáticamente. La regla deberá comprobar si el pago ya fue registrado.</p><span class="tag green">Flujo deseado</span></div></div></div>`;}
function finance(){const total=S.expenses.reduce((a,x)=>a+x.amount,0),pending=counts().expenses,pct=Math.min(100,Math.round(total/S.budget*100)),byCat=cats.filter(c=>c!=='Sin clasificar').map(c=>({name:c,amount:S.expenses.filter(e=>e.category===c).reduce((a,x)=>a+x.amount,0)})).filter(x=>x.amount>0);return `${heading('FINANZAS · MEJOR EN COMPUTADORA','Tu revisión semanal','Entender en qué gastas, sin llevar la contabilidad cada día.',button(`${I('plus')} <span class="desktop-text">Agregar gasto</span>`,'new-expense','btn primary'))}<div class="finance-top"><section class="card card-pad">${cardHead('Gastos identificados',`<span class="tag amber">Datos incompletos</span>`)}<div class="budget-metrics"><div><strong>${money(total)}</strong><span>Gasto identificado</span></div><div><strong>${money(S.budget)}</strong><span>Presupuesto de ejemplo</span></div><div><strong>${pct}%</strong><span>Del presupuesto</span></div></div><div class="progress-outer"><div class="progress-bar" style="width:${pct}%"></div></div><p class="small" style="margin-top:11px">No es tu saldo disponible: hay movimientos sin revisar y compras que podrían faltar.</p></section><section class="card card-pad">${cardHead('Para revisar esta semana')}<div style="display:flex;align-items:center;gap:15px"><div style="font-size:43px;line-height:1;font-weight:800;color:var(--primary)">${pending}</div><div><strong style="font-size:13px">Movimientos sin categoría</strong><p class="small">Revisar, clasificar y seguir adelante.</p></div></div>${button(`${I('check')} ${pending?'Revisar movimientos':'Revisión completada'}`,'weekly-review','btn primary wide',pending?'':'disabled')}</section></div><div class="two-col"><section class="card card-pad">${cardHead('Movimientos',`<span class="tiny">Todos los importes son inventados</span>`)}<table class="expense-table"><thead><tr><th>Descripción</th><th>Categoría</th><th>Cómo se pagó</th><th>Importe</th><th></th></tr></thead><tbody>${S.expenses.map(e=>`<tr><td><strong>${esc(e.name)}</strong>${e.installments>1?`<div class="tiny">Compra a ${e.installments} meses</div>`:''}</td><td>${e.reviewed?`<span class="tag green">${esc(e.category)}</span>`:`<span class="tag amber">Sin clasificar</span>`}</td><td>${esc(e.method)}</td><td><strong>${money(e.amount)}</strong></td><td>${button(I('pencil','sm'),'edit-expense-'+e.id,'btn sm','aria-label="Editar movimiento"')}</td></tr>`).join('')}</tbody></table></section><div class="col-stack"><section class="card card-pad">${cardHead('En qué has gastado')}${byCat.map(x=>`<div class="bar-row"><span>${x.name}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(7,Math.round(100*x.amount/total))}%"></div></div><strong>${money(x.amount)}</strong></div>`).join('')}<div class="divider"></div><p class="small">Los gastos aún no clasificados no se atribuyen a una categoría inventada.</p></section><section class="card card-pad">${cardHead('Compras a meses')}<div class="soft amber"><div class="box-title">${I('credit','sm')} Electrodoméstico</div><div class="small">${money(1200)} · 3 meses · tarjeta</div></div><p class="small" style="margin-top:12px">La compra y sus pagos mensuales se distinguen para evitar contar el mismo gasto dos veces.</p></section></div></div>`;}
function inbox(){return `${heading('CAPTURA UNIVERSAL','Guardar ahora, organizar después','Textos, enlaces y referencias sin abrir otra app.',button(`${I('plus')} <span class="desktop-text">Capturar</span>`,'capture','btn primary'))}${captureRibbon()}<div class="two-col"><section class="card card-pad">${cardHead('Tu bandeja de entrada',`<span class="tag">${S.inbox.length} guardados</span>`)}${S.inbox.length?S.inbox.map(x=>`<div class="inbox-item"><span class="mini-icon">${I(x.kind==='Enlace'?'link':x.kind==='Archivo'?'paper':'inbox')}</span><div class="inbox-item-main"><strong>${esc(x.text)}</strong><span>${x.kind} · ${x.added}</span></div>${button('Convertir en tarea','inbox-task-'+x.id,'btn sm')}</div>`).join(''):`<div class="empty">${I('inbox','lg')}<h3>Tu bandeja está vacía</h3><p>Guarda algo cuando lo necesites, sin organizarlo de inmediato.</p></div>`}</section><section class="card card-pad"><h3>Una entrada, distintos destinos</h3><p class="small" style="margin:9px 0 15px">Lo guardado puede quedarse como referencia o convertirse en un pendiente cuando sea necesario.</p><div class="pill-row"><span class="pill">${I('list','sm')} Pendiente</span><span class="pill">${I('calendar','sm')} Cita</span><span class="pill">${I('wallet','sm')} Gasto</span><span class="pill">${I('archive','sm')} Referencia</span></div></section></div>`;}
function render(){const c=counts();document.getElementById('app').innerHTML=`<div class="app">${sidebar()}<div class="main-wrap"><header class="topbar"><div class="topbar-left">☀ &nbsp;Un lugar para todo lo que necesitas recordar</div><div class="top-mobile-brand"><div class="brand-mark" style="height:30px;width:30px;border-radius:9px">${I('sun','sm')}</div> MI DÍA</div><div class="topbar-right"><span class="tag purple">DEMO · Datos ficticios</span><span class="date-badge desktop-only">${dateLabel()}</span><span class="avatar">MD</span></div></header><main class="main">${S.page==='home'?home():S.page==='agenda'?agenda():S.page==='tasks'?tasks():S.page==='consultorio'?consultorio():S.page==='finanzas'?finance():inbox()}<div class="footnote">Prototipo de experiencia v1 · No conectado a servicios reales · No ingresar información de pacientes</div></main></div></div>${mobileNav()}${S.modal?modalHTML():''}${S.toast?`<div class="notification" role="status">${I('check')} ${esc(S.toast)}</div>`:''}`;}
function modalHTML(){const m=S.modal;let body='',title='',foot='';
if(m.type==='capture'){title='Guardar algo rápidamente';body=`<form id="captureForm"><div class="field"><label for="captureText">¿Qué necesitas guardar?</label><textarea class="control" id="captureText" name="captureText" required autofocus placeholder="Ej. Llamar al médico, enlace, idea, nota…"></textarea></div><div class="field"><label for="captureKind">¿Dónde lo guardamos? (opcional)</label><select class="control" name="captureKind" id="captureKind"><option value="inbox">En mi bandeja, lo veo después</option><option value="task">Como pendiente de hoy</option><option value="carry">Como pendiente sin fecha</option></select></div><div class="notice">También puedes pegar enlaces. No hace falta elegir una hora ni consultar Calendar.</div><div class="modal-footer"><button class="btn" data-action="close-modal" type="button">Volver</button><button type="submit" class="btn primary">${I('check')} Guardar</button></div></form>`;}
if(m.type==='new-task'){title='Nuevo pendiente';body=`<form id="newTaskForm"><div class="field"><label>¿Qué necesitas hacer?</label><input class="control" name="title" maxlength="160" required placeholder="Ej. Pedir cita médica" autofocus/></div><div class="field"><label>¿Cuándo quieres verlo?</label><select class="control" name="when"><option value="today">Hoy</option><option value="carry">Sin fecha, en pendientes</option></select></div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Volver</button><button class="btn primary" type="submit">Guardar pendiente</button></div></form>`;}
if(m.type==='move-task'){const task=S.tasks.find(t=>t.id===m.id);title='Mover pendiente';body=`<p class="small" style="margin-bottom:15px">${esc(task?.title)}</p><form id="moveTaskForm"><input type="hidden" name="id" value="${m.id}"/><div class="field"><label>Fecha nueva</label><input name="date" class="control" type="date" required /></div><div class="modal-footer"><button type="button" data-action="close-modal" class="btn">Cancelar</button><button type="submit" class="btn primary">Guardar fecha</button></div></form>`;}
if(m.type==='reply'){const item=S.confirmations.find(a=>a.id===m.id);title='Simular respuesta';body=`<p class="small" style="margin-bottom:15px">${item?.name} · Consulta de mañana a las ${item?.time}. ¿Qué respondería?</p><div style="display:flex;flex-direction:column;gap:9px">${button(`${I('check')} Sí, confirmo`,'reply-yes-'+m.id,'btn wide')}${button(`${I('refresh')} Necesito reagendar`,'reply-no-'+m.id,'btn wide')}${button(`${I('clock')} Mantener pendiente`,'close-modal','btn wide')}</div><div class="notice" style="margin-top:14px">Es una simulación local. No lee ni envía mensajes de WhatsApp.</div>`;}
if(m.type==='rebook'){title='Reagendar personalmente';const item=S.confirmations.find(x=>x.id===m.id);body=`<p class="small">${item?.name} necesita otro horario. Esta decisión queda en tus manos.</p><div class="result-card"><strong>Próximo paso</strong><p class="small">En la versión real se mostrarían los horarios disponibles de Google Calendar y un acceso a la conversación correspondiente. No se modifica la cita automáticamente.</p></div><div class="modal-footer">${button('Cerrar','close-modal','btn primary')}</div>`;}
if(m.type==='expense'||m.type==='edit-expense'){const edit=m.type==='edit-expense'?S.expenses.find(x=>x.id===m.id):null;title=edit?'Revisar movimiento':'Registrar un gasto';body=`<form id="expenseForm"><input type="hidden" name="id" value="${edit?.id||''}"/><div class="field"><label>Descripción</label><input class="control" name="name" required maxlength="100" value="${esc(edit?.name||'')}" placeholder="Ej. Supermercado"/></div><div class="form-grid"><div class="field"><label>Importe (MXN)</label><input class="control" name="amount" type="number" step="0.01" min="0.01" required value="${edit?.amount||''}" placeholder="0.00"/></div><div class="field"><label>Categoría</label><select class="control" name="category">${cats.map(x=>`<option value="${x}" ${x===(edit?.category||'Sin clasificar')?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Forma de pago</label><select class="control" name="method">${['Tarjeta','Efectivo','Transferencia'].map(x=>`<option value="${x}" ${x===(edit?.method||'Tarjeta')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Meses de la compra</label><select class="control" name="installments">${[1,3,6,9,12,18].map(x=>`<option value="${x}" ${x===(edit?.installments||1)?'selected':''}>${x===1?'Una sola exhibición':x+' meses'}</option>`).join('')}</select></div></div><div class="notice">Registro de demostración. No se consulta ninguna cuenta bancaria ni se almacena información después de cerrar la página.</div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Volver</button><button class="btn primary" type="submit">Guardar movimiento</button></div></form>`;}
if(m.type==='show-availability'||m.type==='new-event'){title='Consultar disponibilidad';body=`<div class="soft green"><div class="box-title">${I('calendar','sm')} Conectar Google Calendar</div><p class="small">En MI DÍA real podrías revisar tu disponibilidad y crear la cita sin salir del sistema. Esta pantalla muestra el flujo previsto; aún no hay una cuenta vinculada.</p></div><div class="result-card"><strong>Paso 1</strong><p class="small">Seleccionar fecha y visualizar horarios realmente disponibles.</p></div><div class="result-card"><strong>Paso 2</strong><p class="small">Confirmar con la persona y, solo entonces, guardar el evento.</p></div><div class="modal-footer">${button('Entendido','close-modal','btn primary')}</div>`;}
if(m.type==='weekly-review'){const pending=S.expenses.filter(x=>!x.reviewed);title='Revisión financiera';body=pending.length?`<p class="small" style="margin-bottom:13px">Vamos de uno en uno. Sin reconstruir todo el mes.</p><div class="result-card"><strong>${esc(pending[0].name)} · ${money(pending[0].amount)}</strong><p class="small">Elige una categoría; puedes corregirla después.</p><div class="field" style="margin-top:13px"><select class="control" id="reviewCat">${cats.filter(x=>x!=='Sin clasificar').map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div>${button('Clasificar y continuar','review-next-'+pending[0].id,'btn primary wide')}</div><p class="small" style="margin-top:12px">Quedan ${pending.length} movimientos por revisar.</p>`:`<div class="empty">${I('check','lg')}<h3>¡Revisión terminada!</h3><p>Ya clasificaste los movimientos de ejemplo.</p></div><div class="modal-footer">${button('Cerrar','close-modal','btn primary')}</div>`;}
if(m.type==='close-day'){title='Cierre de consultas';body=`<p class="small">Este módulo relacionaría las consultas efectivamente realizadas con sus honorarios, sin asumir que todas fueron cobradas.</p><div class="result-card"><strong>${S.honorarios.length} consultas registradas</strong><div class="small">${S.honorarios.filter(x=>x.status==='pagado').length} pagadas · ${counts().unpaid} pendientes</div></div><div class="notice" style="margin-top:13px">En producción, los datos provendrían de la integración autorizada con AppSheet o la herramienta que se defina.</div><div class="modal-footer">${button('Cerrar','close-modal','btn primary')}</div>`;}
return `<div class="modal-wrap" data-backdrop><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-heading"><div><div class="eyebrow" style="margin-bottom:6px">MI DÍA · PROTOTIPO</div><h2>${title}</h2></div><button class="modal-close" data-action="close-modal" aria-label="Cerrar">${I('close')}</button></div>${body}</div></div>`;
}
let toastTimer;
function toast(text){S.toast=text;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toast=null;render()},3700)}
function page(id){S.page=id;S.modal=null;render();window.scrollTo({top:0,behavior:'instant'});}
function action(act){if(!act)return;if(act==='capture'||act==='new-task'||act==='new-expense'||act==='new-event'||act==='show-availability'||act==='close-day'){S.modal={type:act==='new-expense'?'expense':act};render();return;}if(act==='close-modal'){S.modal=null;render();return;}if(act==='weekly-review'){S.modal={type:'weekly-review'};render();return;}if(act.startsWith('edit-expense-')){S.modal={type:'edit-expense',id:Number(act.split('-').pop())};render();return;}if(act.startsWith('review-next-')){const e=S.expenses.find(x=>x.id===Number(act.split('-').pop()));if(e){e.category=document.querySelector('#reviewCat').value;e.reviewed=true;}S.modal={type:'weekly-review'};render();return;}if(act.startsWith('simulate-reply-')){const id=Number(act.split('-').pop());const item=S.confirmations.find(x=>x.id===id);if(!item||item.status!=='pendiente'){toast('Elige una cita pendiente para simular una respuesta.');return;}S.modal={type:'reply',id};render();return;}if(act.startsWith('reply-yes-')){const a=S.confirmations.find(x=>x.id===Number(act.split('-').pop()));if(a)a.status='confirmada';S.modal=null;toast('Cita marcada como confirmada · simulación');return;}if(act.startsWith('reply-no-')){const a=S.confirmations.find(x=>x.id===Number(act.split('-').pop()));if(a)a.status='reagendar';S.modal={type:'rebook',id:a.id};render();return;}if(act.startsWith('manage-rebook-')){S.modal={type:'rebook',id:Number(act.split('-').pop())};render();return;}if(act.startsWith('paid-')){const a=S.honorarios.find(x=>x.id===Number(act.split('-').pop()));if(a){a.status='pagado';a.method='Registrado manualmente';}toast('Honorario marcado como pagado · simulación');return;}if(act.startsWith('task-done-')){const a=S.tasks.find(x=>x.id===Number(act.split('-').pop()));if(a)a.status='done';toast('Pendiente completado y guardado en historial');return;}if(act.startsWith('restore-task-')){const a=S.tasks.find(x=>x.id===Number(act.split('-').pop()));if(a)a.status='carry';toast('Pendiente recuperado');return;}if(act.startsWith('move-date-')){S.modal={type:'move-task',id:Number(act.split('-').pop())};render();return;}if(act.startsWith('inbox-task-')){const id=Number(act.split('-').pop());const a=S.inbox.find(x=>x.id===id);if(a){S.tasks.unshift({id:++S.counter,title:a.text,status:'carry',note:'Capturado desde la bandeja'});S.inbox=S.inbox.filter(x=>x.id!==id);}toast('Convertido en pendiente sin fecha');return;}}
function changeTask(id,value){const t=S.tasks.find(x=>x.id===id);if(!t)return;if(value==='today'){t.status='today';t.note='Para resolver hoy';toast('Pendiente movido a hoy');}if(value==='later'){S.modal={type:'move-task',id};render();}if(value==='archive'){t.status='archived';toast('Archivado; puedes recuperarlo desde Historial');}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-page]');if(t){page(t.dataset.page);return;}const n=e.target.closest('[data-tasktab]');if(n){S.taskTab=n.dataset.tasktab;render();return;}const b=e.target.closest('[data-action]');if(b){action(b.dataset.action);return;}if(e.target.matches('[data-backdrop]')){S.modal=null;render();}});
document.addEventListener('change',e=>{if(e.target.matches('[data-routine]')){const a=S.routines.find(x=>x.id===Number(e.target.dataset.routine));if(a)a.done=e.target.checked;render();}if(e.target.matches('[data-taskchoice]')&&e.target.value){changeTask(Number(e.target.dataset.taskchoice),e.target.value);}});
document.addEventListener('submit',e=>{if(!['captureForm','newTaskForm','moveTaskForm','expenseForm'].includes(e.target.getAttribute('id')))return;e.preventDefault();const data=new FormData(e.target);if(e.target.getAttribute('id')==='captureForm'){const v=String(data.get('captureText')||'').trim(),kind=data.get('captureKind');if(!v)return;if(kind==='inbox'){S.inbox.unshift({id:++S.counter,text:v,kind:/https?:\/\//.test(v)?'Enlace':'Nota',added:'Ahora'});S.page='inbox';}else{S.tasks.unshift({id:++S.counter,title:v,status:kind==='task'?'today':'carry',note:kind==='task'?'Para hoy':'Sin fecha'});S.page='tasks';S.taskTab=kind==='task'?'hoy':'pendientes';}S.modal=null;toast('Guardado. Puedes organizarlo después.');}if(e.target.getAttribute('id')==='newTaskForm'){S.tasks.unshift({id:++S.counter,title:String(data.get('title')).trim(),status:data.get('when')==='today'?'today':'carry',note:data.get('when')==='today'?'Para hoy':'Sin fecha'});S.modal=null;S.taskTab=data.get('when')==='today'?'hoy':'pendientes';toast('Pendiente guardado');}if(e.target.getAttribute('id')==='moveTaskForm'){const t=S.tasks.find(x=>x.id===Number(data.get('id')));if(t){t.status='scheduled';t.when=String(data.get('date'));t.note='Reprogramado al '+t.when;}S.modal=null;S.page='tasks';S.taskTab='proximos';toast('Pendiente reprogramado y visible en Próximos');}if(e.target.getAttribute('id')==='expenseForm'){const id=Number(data.get('id'));const obj={id:id||++S.counter,name:String(data.get('name')).trim(),amount:Number(data.get('amount')),category:String(data.get('category')),method:String(data.get('method')),installments:Number(data.get('installments')),reviewed:data.get('category')!=='Sin clasificar'};if(!obj.name||!(obj.amount>0)){return;}if(id){S.expenses=S.expenses.map(x=>x.id===id?obj:x);}else S.expenses.unshift(obj);S.modal=null;S.page='finanzas';toast('Movimiento actualizado en la demostración');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
render();
})();
</script>
</body>
</html>
